services:
  curatarr:
    build: .
    container_name: curatarr
    ports:
      - "8753:8000"
    environment:
      # Source Xtream URL is set/changed in the UI ("Source…") and saved in the
      # DB. Optionally seed it once with SOURCE_M3U (a get.php/player_api URL
      # containing username & password).
      # SOURCE_M3U: http://provider.example/get.php?username=...&password=...&type=m3u_plus
      DB_PATH: /data/curator.db
      # Credentials Dispatcharr uses to consume our Xtream wrapper. Generated
      # once if unset; shown in the UI under "Dispatcharr setup".
      # XC_USER: curator
      # XC_PASS: change-me
    volumes:
      # SQLite DB (scan cache + curated ledger) lives here.
      - ./data:/data
    restart: unless-stopped

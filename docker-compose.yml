# Curatarr — TrueNAS Scale deployment (Docker Compose)
#
# Deploy from the CLI on the TrueNAS host (the app builds from this repo):
#   1) Put this repo at /mnt/MainPool/AppsStorage/Curatarr
#   2) docker compose up -d         (pull_policy: build forces an image build)
#   3) Open http://<truenas-ip>:8753 → ⚙ Settings → Source → add subscription(s) → Sync → import.
#   4) In Dispatcharr, add each account from Settings → Xtream as an Xtream Codes
#      account using Server URL http://<truenas-ip>:8753 (VOD scanning ON, max conns 1).
#
# Dispatcharr reaches Curatarr via the TrueNAS host IP + published port (8753) — no
# shared Docker network required.

services:
  curatarr:
    # Default: build from this repo on the box.
    build: /mnt/MainPool/AppsStorage/Curatarr
    image: curatarr:latest
    pull_policy: build
    # To pull the published image from GHCR instead (after the GitHub Action
    # publishes it), replace the three lines above with a pinned version:
    #   image: ghcr.io/ghalibsaleem/curatarr:0.4.1   # pin a release, or :latest (main HEAD)
    #   pull_policy: always
    container_name: curatarr
    ports:
      - "8753:8000"          # host:container
    environment:
      DB_PATH: /data/curatarr.db
      # Pin the wrapper password so it's stable (otherwise generated once and
      # shown under Settings → Xtream):
      # XC_USER: curator
      # XC_PASS: change-me-to-a-secret
      # Optionally seed the source on first run (otherwise add it in the UI):
      # SOURCE_M3U: "http://provider/get.php?username=...&password=...&type=m3u_plus"
    volumes:
      # Persist the SQLite DB (subscriptions + curated picks) on the AppsStorage
      # dataset (snapshotted); kept in a data/ subdir of the repo.
      - /mnt/MainPool/AppsStorage/Curatarr/data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    restart: unless-stopped

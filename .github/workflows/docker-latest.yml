name: Promote :latest

# Second stage of the release: runs ONLY after "Publish version image" finishes
# successfully, and only when that run was triggered by a vX.Y.Z tag (not a beta
# push). It re-tags the already-published release manifest as :latest — no rebuild,
# so :latest and :X.Y.Z share one identical digest. This is why :latest tracks the
# newest release instead of main HEAD.
#
# NOTE: workflow_run only fires when THIS file exists on the default branch (main).
# The `workflows:` value matches the other workflow's `name:` field, not its filename.

on:
  workflow_run:
    workflows: ["Publish version image"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  promote:
    # Guard: the upstream build passed AND it was a tag push (head_branch is the tag
    # name, e.g. "v0.4.4"). A beta push has head_branch "beta" and is skipped. If the
    # branch can't be read, this no-ops rather than promoting the wrong image.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag the released digest as :latest
        env:
          # head_branch is the tag that triggered the release build (e.g. "v0.4.4").
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          IMG="ghcr.io/${{ github.repository }}"
          VERSION="${TAG#v}"
          echo "Promoting ${IMG}:${VERSION} → ${IMG}:latest"
          docker buildx imagetools create -t "${IMG}:latest" "${IMG}:${VERSION}"

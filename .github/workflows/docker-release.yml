name: Publish version image

# Builds the multi-arch image (amd64 + arm64) and pushes the VERSION tags to GHCR.
#   * a `vX.Y.Z` git tag → :X.Y.Z and :X.Y   (a frozen release)
#   * a push to `beta`   → :edge             (pre-release testing)
# `:latest` is NOT published here — it is promoted from a successful release build
# by the chained "Promote :latest" workflow (docker-latest.yml), so :latest always
# tracks the newest release rather than main HEAD.
#
# 32-bit ARM (arm/v7) is intentionally NOT built: pydantic-core (Rust), uvloop and
# watchfiles ship no 32-bit-ARM wheels. Run 64-bit Raspberry Pi OS for arm64.

on:
  push:
    branches: [beta]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner cross-build the arm64 image.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # :X.Y.Z / :X.Y come from v* tags; :edge from the beta branch. No :latest.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=beta

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

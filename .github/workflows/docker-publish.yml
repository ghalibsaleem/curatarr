name: Publish Docker image

# Builds a multi-arch image (amd64 + arm64 — covers Intel/AMD, Apple Silicon, and
# 64-bit Raspberry Pi) and pushes it to the GitHub Container Registry
# (ghcr.io/<owner>/<repo>) on every push to main and on tags. Docker pulls the
# right architecture automatically from the published manifest.
#
# 32-bit ARM (arm/v7) is intentionally NOT built: pydantic-core (Rust), uvloop and
# watchfiles ship no 32-bit-ARM wheels, so it would require a slow source compile
# under emulation. Run 64-bit Raspberry Pi OS to use the arm64 image instead.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner cross-build the arm64 image.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
